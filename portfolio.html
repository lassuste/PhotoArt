<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Портфолио — ФотоАрт</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo">Фото<span>Арт</span></a>
      <nav class="nav" id="nav">
        <a href="index.html">Главная</a>
        <a href="services.html">Услуги</a>
        <a href="portfolio.html">Портфолио</a>
        <a href="price.html">Цены</a>
        <a href="booking.html">Запись</a>
        <a href="contacts.html">Контакты</a>
      </nav>
      <button class="burger" id="burger" aria-label="Меню">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main>

    <section class="section">
      <div class="container">
        <h2 class="section-title">Портфолио</h2>
        <p class="section-sub">Выберите категорию, чтобы увидеть профильные работы</p>
        <div class="filters">
          <button class="active" data-filter="all">Все работы</button>
          <button data-filter="portrait">Портреты</button>
          <button data-filter="wedding">Свадьбы</button>
          <button data-filter="family">Семья</button>
          <button data-filter="commercial">Коммерция</button>
        </div>
        <div class="gallery">
          <div class="tile" data-cat="portrait"><img src="img/portrait-1.png" alt="Портретная съёмка"><span class="tag">Портрет</span></div>
          <div class="tile" data-cat="portrait"><img src="img/portrait-2.png" alt="Портретная съёмка"><span class="tag">Портрет</span></div>
          <div class="tile" data-cat="wedding"><img src="img/wedding-1.png" alt="Свадебная съёмка"><span class="tag">Свадьба</span></div>
          <div class="tile" data-cat="wedding"><img src="img/wedding-2.png" alt="Свадебная съёмка"><span class="tag">Свадьба</span></div>
          <div class="tile" data-cat="portrait"><img src="img/style-1.png" alt="Мода"><span class="tag">Мода</span></div>
          <div class="tile" data-cat="family"><img src="img/family-1.png" alt="Семейная съёмка"><span class="tag">Семья</span></div>
          <div class="tile" data-cat="family"><img src="img/family-2.png" alt="Семейная съёмка"><span class="tag">Семья</span></div>
          <div class="tile" data-cat="commercial"><img src="img/commercial-1.png" alt="Коммерческая съёмка"><span class="tag">Коммерция</span></div>
          <div class="tile" data-cat="commercial"><img src="img/commercial-2.png" alt="Коммерческая съёмка"><span class="tag">Коммерция</span></div>
        </div>
      </div>
    </section>

  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <div>© 2026 Фотостудия «ФотоАрт». Все права защищены.</div>
      <div>+7 (351) 200-00-00 &nbsp;·&nbsp; hello@fotoart.ru</div>
    </div>
  </footer>

  <script src="script.js" defer></script>
</body>
</html>
